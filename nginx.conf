# ════════════════════════════════════════════════════════════════
#  KATASHIE VPN — Configuration Nginx
#  ⚠️  Remplacez VOTRE_DOMAINE.COM par votre vrai domaine
#  Exemple: katashievpn.com ou panel.monvpn.net
#
#  Pour générer le certificat SSL:
#    certbot certonly --standalone -d VOTRE_DOMAINE.COM
# ════════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Zones de rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ─── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/html; }
        location / { return 301 https://$host$request_uri; }
    }

    # ─── KATASHIE VPN Web Panel ─────────────────────────────────
    server {
        listen 443 ssl http2;
        # ⚠️  À CHANGER : votre vrai domaine
        server_name VOTRE_DOMAINE.COM;

        # ⚠️  À CHANGER : chemin de votre certificat SSL
        ssl_certificate     /etc/letsencrypt/live/VOTRE_DOMAINE.COM/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/VOTRE_DOMAINE.COM/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # En-têtes de sécurité
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com data:";

        # Auth rate limité
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         http://katashie-web:2087;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # API routes
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://katashie-web:2087;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # SSE support (monitoring stream temps réel)
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }

        # SPA frontend
        location / {
            proxy_pass         http://katashie-web:2087;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        keep-alive;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── WhatsApp Webhook ──────────────────────────────────────
    server {
        listen 443 ssl http2;
        # ⚠️  À CHANGER : sous-domaine WhatsApp
        server_name wa.VOTRE_DOMAINE.COM;

        # ⚠️  À CHANGER : utilisez le même cert ou un cert wildcard
        ssl_certificate     /etc/letsencrypt/live/VOTRE_DOMAINE.COM/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/VOTRE_DOMAINE.COM/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /whatsapp {
            proxy_pass         http://katashie-whatsapp-bot:5001;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
